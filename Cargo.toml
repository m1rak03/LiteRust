[package]
name = "literust-browser"
version = "0.17.0-alpha.3"
rust-version = "1.89"
edition = "2021"
description = "Experimental memory-conscious browser shell written in Rust"
license = "MIT"

[dependencies]
getrandom = "0.2"
wry = { version = "=0.57.2", optional = true }
tao = { version = "=0.37.2", optional = true }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
url = "2.5"
scraper = "=0.24.0"
base64 = "0.22"
percent-encoding = "2"
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_Security"] }

[features]
default = ["desktop"]
desktop = ["dep:wry", "dep:tao"]

[[bin]]
name = "literust-browser"
path = "src/main.rs"
required-features = ["desktop"]
