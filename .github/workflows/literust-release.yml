name: Build and verify LiteRust installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['docs/releases/0.18.0-alpha.1.md']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Archive clean source
        run: python tools/package-source.py --output-dir "${{ runner.temp }}/literust-source"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Extract sources and build
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-windows-amd64.zip' -OutFile sing-box.zip
          if ((Get-FileHash sing-box.zip -Algorithm SHA256).Hash.ToLower() -ne '99185d75d314a07dbba4a130c8ad986cbeb629a07927975636b341ca61f991df') { throw 'sing-box checksum mismatch' }
          Expand-Archive sing-box.zip -DestinationPath sing-box-download
          Copy-Item sing-box-download/sing-box-1.14.4-windows-amd64/sing-box.exe vendor/sing-box/
          Copy-Item sing-box-download/sing-box-1.14.4-windows-amd64/libcronet.dll vendor/sing-box/
          & ./packaging/system-vpn.ps1 -ProxyPort 1080 -ParentId 999 -ConfigOnly | Set-Content tun-check.json -Encoding utf8
          & ./vendor/sing-box/sing-box.exe check -c tun-check.json
          if ($LASTEXITCODE -ne 0) { throw 'TUN configuration validation failed' }
          cargo test --locked --no-default-features --lib
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          cargo build --locked --release
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          $loader = Get-ChildItem "$env:USERPROFILE/.cargo/registry/src" -Filter WebView2Loader.dll -Recurse | Where-Object { $_.FullName -match 'webview2-com-sys-0.39.1.*[\\/]x64[\\/]' } | Select-Object -First 1
          if (-not $loader) { throw 'Loader DLL missing' }
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/?linkid=2124701' -OutFile runtime-installer.exe
          $signature = Get-AuthenticodeSignature ./runtime-installer.exe
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') { throw 'Runtime installer signature invalid' }
          Start-Process ./runtime-installer.exe -ArgumentList '/silent','/install' -Wait
          Copy-Item $loader.FullName target/release/WebView2Loader.dll
          Copy-Item vendor/sing-box/sing-box.exe target/release/
          Copy-Item vendor/sing-box/libcronet.dll target/release/
          Copy-Item packaging/system-vpn.ps1 target/release/
          $tunTest = Start-Process target/release/literust-browser.exe -ArgumentList '--tun-self-test' -PassThru
          if (-not $tunTest.WaitForExit(90000)) { Stop-Process -Id $tunTest.Id -Force; throw 'TUN test timed out' }
          Get-Content target/release/tun-self-test.log
          Get-ChildItem target/release/system-vpn.ps1.*.log | ForEach-Object { Write-Output $_.Name; Get-Content $_.FullName }
          if (Test-Path target/release/system-vpn.ps1.stderr.log) { Get-Content target/release/system-vpn.ps1.stderr.log }
          Get-NetAdapter | Select-Object Name,Status,InterfaceDescription
          if (Test-Path target/release/tun-helper-error.log) { Get-Content target/release/tun-helper-error.log }
          $tunTest.Refresh()
          if ($tunTest.ExitCode -ne 0) { throw 'Windows TUN routing test failed' }
          if (Get-NetRoute -DestinationPrefix '198.18.0.0/15' -ErrorAction SilentlyContinue | Where-Object InterfaceAlias -like 'LiteRustVPN-*') { throw 'TUN route not cleaned up' }
          $app = Start-Process target/release/literust-browser.exe -PassThru
          $log = "$env:LOCALAPPDATA/LiteRustBrowser/diagnostics/startup.log"
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 2
              if (Test-Path $log) {
                $content = Get-Content $log -Raw
                if (($content -match 'Main toolbar IPC ready') -and ($content -match 'New tab document ready')) { $ready = $true; break }
              }
              if ($app.HasExited) { break }
            }
            if (Test-Path $log) { Get-Content $log }
            if (-not $ready) { throw 'Native Windows UI did not become ready' }
            $shellKeys = New-Object -ComObject WScript.Shell
            if (-not $shellKeys.AppActivate($app.Id)) { throw 'Cannot focus browser for F11 test' }
            Start-Sleep -Milliseconds 500
            Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public static class WindowState { [DllImport("user32.dll")] public static extern bool IsZoomed(IntPtr hwnd); }'
            $app.Refresh()
            if (-not [WindowState]::IsZoomed($app.MainWindowHandle)) { throw 'Browser did not start maximized' }
            Add-Type -TypeDefinition @'
            using System; using System.Runtime.InteropServices;
            public static class FrameTest {
              [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left,Top,Right,Bottom; }
              [StructLayout(LayoutKind.Sequential)] public struct POINT { public int X,Y; }
              [DllImport("user32.dll")] public static extern bool ClientToScreen(IntPtr h,ref POINT p);
              [DllImport("user32.dll")] public static extern bool GetClientRect(IntPtr h,out RECT r);
              [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h,out RECT r);
              [DllImport("user32.dll")] public static extern uint GetDpiForWindow(IntPtr h);
              [DllImport("user32.dll")] public static extern bool SetCursorPos(int x,int y);
              [DllImport("user32.dll")] public static extern void mouse_event(uint flags,uint dx,uint dy,uint data,UIntPtr extra);
              [DllImport("user32.dll")] public static extern bool MoveWindow(IntPtr h,int x,int y,int w,int height,bool repaint);
              [DllImport("user32.dll")] public static extern bool IsIconic(IntPtr h);
              [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr h,int cmd);
            }
          '@
            function Click-CaptionButton([int]$FromRight) {
              $rect=New-Object FrameTest+RECT
              $origin=New-Object FrameTest+POINT
              [void][FrameTest]::GetClientRect($app.MainWindowHandle,[ref]$rect)
              [void][FrameTest]::ClientToScreen($app.MainWindowHandle,[ref]$origin)
              $scale=[FrameTest]::GetDpiForWindow($app.MainWindowHandle)/96.0
              $inset=if([WindowState]::IsZoomed($app.MainWindowHandle)){0}else{6}
              [void][FrameTest]::SetCursorPos([int]($origin.X+$rect.Right-($FromRight+$inset)*$scale),[int]($origin.Y+(21+$inset)*$scale))
              [FrameTest]::mouse_event(2,0,0,0,[UIntPtr]::Zero)
              [FrameTest]::mouse_event(4,0,0,0,[UIntPtr]::Zero)
              Start-Sleep -Seconds 1
            }
            Click-CaptionButton 69
            if ([WindowState]::IsZoomed($app.MainWindowHandle)) { throw 'Custom restore button failed' }
            [void][FrameTest]::MoveWindow($app.MainWindowHandle,40,40,900,600,$true)
            Start-Sleep -Seconds 1
            # Tao retains WS_CAPTION for native window behavior; WM_NCCALCSIZE removes the visible titlebar.
            $outer=New-Object FrameTest+RECT
            $clientOrigin=New-Object FrameTest+POINT
            [void][FrameTest]::GetWindowRect($app.MainWindowHandle,[ref]$outer)
            [void][FrameTest]::ClientToScreen($app.MainWindowHandle,[ref]$clientOrigin)
            if ([math]::Abs($clientOrigin.Y-$outer.Top) -gt 2) { throw 'Unexpected non-client titlebar height' }
            Click-CaptionButton 69
            if (-not [WindowState]::IsZoomed($app.MainWindowHandle)) { throw 'Custom maximize button failed' }
            Click-CaptionButton 115
            if (-not [FrameTest]::IsIconic($app.MainWindowHandle)) { throw 'Custom minimize button failed' }
            [void][FrameTest]::ShowWindow($app.MainWindowHandle,9)
            [void]$shellKeys.AppActivate($app.Id)
            Start-Sleep -Seconds 1
            $shellKeys.SendKeys('{F11}')
            Start-Sleep -Milliseconds 500
            if ((Get-Content $log -Raw) -match 'Fullscreen enabled') { throw 'Legacy fullscreen remains active' }
            Write-Output 'PASS: no system caption, custom minimize/maximize/restore, legacy fullscreen removed'
            foreach ($entry in @(@('^t','new_tab'),@('^w','close_tab'),@('^+t','reopen_tab'),@('^l','address'),@('^t','new_tab'),@('^{TAB}','next_tab'),@('^f','find'))) {
              $shellKeys.SendKeys($entry[0])
              Start-Sleep -Seconds 1
              if ((Get-Content $log -Raw) -notmatch ('Shortcut dispatched: '+$entry[1])) { throw ('Native shortcut failed: '+$entry[1]) }
            }
            $shellKeys.SendKeys('{ESC}')
            Write-Output 'PASS: native tab, reopen, address, switch and find shortcuts'
            Click-CaptionButton 23
            if (-not $app.WaitForExit(15000)) { throw 'Custom close button failed' } 

          } finally {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          }
          node tools/test-downloads-windows.cjs (Resolve-Path target/release/literust-browser.exe)
          if ($LASTEXITCODE -ne 0) { throw 'Native download manager test failed' }
          node tools/test-split-windows.cjs (Resolve-Path target/release/literust-browser.exe)
          if ($LASTEXITCODE -ne 0) { throw 'Native split view, workspace, page tools or resource test failed' }
          & ./tools/test-window-lifecycle.ps1 -Exe (Resolve-Path target/release/literust-browser.exe)
          & ./tools/test-sessions-windows.ps1 -Exe (Resolve-Path target/release/literust-browser.exe)
          if ($LASTEXITCODE -ne 0) { throw 'Session storage test failed' }
          Copy-Item "$env:LOCALAPPDATA/LiteRustSessionTest/results.log" target/release/session-self-test.log
          Copy-Item $loader.FullName packaging/WebView2Loader.dll
          rustc --edition=2021 -O -C target-feature=+crt-static -C strip=symbols tools/installer-close.rs -o packaging/close-browser.exe
          if ($LASTEXITCODE -ne 0) { throw 'Native shutdown helper build failed' }
          choco install nsis -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          & "${env:ProgramFiles(x86)}/NSIS/makensis.exe" packaging/setup.nsi
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          $exe = 'packaging/LiteRust-0.18.0-alpha.1-Setup-x64.exe'
          gh release download v0.16.0-alpha.2 --repo $env:GITHUB_REPOSITORY --pattern LiteRust-0.16.0-alpha.2-Setup-x64.exe --dir previous
          if ($LASTEXITCODE -ne 0) { throw 'Previous installer download failed' }
          $oldInstall = Start-Process previous/LiteRust-0.16.0-alpha.2-Setup-x64.exe -ArgumentList '/S' -Wait -PassThru
          if ($oldInstall.ExitCode -ne 0) { throw 'Previous version installation failed' }
          $folder = Join-Path $env:LOCALAPPDATA 'Programs\LiteRust'
          & ./tools/benchmark-release-windows.ps1 -OldExe "$folder/literust-browser.exe" -NewExe (Resolve-Path target/release/literust-browser.exe)
          $profile = Join-Path $env:LOCALAPPDATA 'LiteRustBrowser' 
          '{"search_engine":"yandex"}' | Set-Content "$profile/browser-data.json" -Encoding utf8
          'preserve-profile' | Set-Content "$profile/upgrade-marker.txt"
          Remove-Item $log -ErrorAction SilentlyContinue
          $oldApp = Start-Process "$folder/literust-browser.exe" -PassThru
          $oldReady = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            if ((Test-Path $log) -and ((Get-Content $log -Raw) -match 'New tab document ready')) { $oldApp.Refresh(); if ($oldApp.MainWindowHandle -ne 0) { $oldReady = $true; break } }
          }
          if (-not $oldReady) { throw 'Old version failed startup before upgrade' }
          $install = Start-Process $exe -ArgumentList '/S' -PassThru
          if (-not $install.WaitForExit(180000)) { Stop-Process -Id $install.Id -Force; throw 'Installer timed out' }
          $install.Refresh()
          if (Test-Path "$profile/diagnostics/install-close.log") { Get-Content "$profile/diagnostics/install-close.log"; Copy-Item "$profile/diagnostics/install-close.log" target/release/ }
          if (Test-Path "$profile/diagnostics/install-helper.log") { Get-Content "$profile/diagnostics/install-helper.log"; Copy-Item "$profile/diagnostics/install-helper.log" target/release/ }
          if ($install.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log }
            throw "Installation failed, exit code: $($install.ExitCode)"
          }
          $oldApp.Refresh()
          if (-not $oldApp.HasExited) { throw 'Upgrade did not close old browser' }
          Remove-Item $log -ErrorAction SilentlyContinue
          $migrating = Start-Process "$folder/literust-browser.exe" -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 2
              if ((Test-Path $log) -and ((Get-Content $log -Raw) -match 'Main toolbar IPC ready')) { $ready = $true; break }
              if ($migrating.HasExited) { break }
            }
            if (Test-Path $log) { Get-Content $log }
            if (-not $ready) { throw 'First launch after upgrade did not migrate profile' }
            if (-not $migrating.CloseMainWindow()) { throw 'Cannot close upgraded browser' }
            if (-not $migrating.WaitForExit(15000)) { throw 'Upgraded browser did not exit' }
          } finally { if (-not $migrating.HasExited) { Stop-Process -Id $migrating.Id -Force } }
          Add-Type -AssemblyName System.Security.Cryptography.ProtectedData
          $bytes = [IO.File]::ReadAllBytes("$profile/browser-data.json")
          $magic = [Text.Encoding]::ASCII.GetBytes("LiteRustDPAPI1`0")
          if ([Text.Encoding]::ASCII.GetString($bytes,0,$magic.Length) -ne "LiteRustDPAPI1`0") { throw 'Profile metadata is not encrypted' }
          $plain = [Security.Cryptography.ProtectedData]::Unprotect($bytes[$magic.Length..($bytes.Length-1)],$null,[Security.Cryptography.DataProtectionScope]::CurrentUser)
          $saved = [Text.Encoding]::UTF8.GetString($plain) | ConvertFrom-Json
          foreach ($backup in @('browser-data.json.bak','browser-data.pre-v09.json')) {
            if (Test-Path "$profile/$backup") {
              $copy = [IO.File]::ReadAllBytes("$profile/$backup")
              if ([Text.Encoding]::ASCII.GetString($copy,0,$magic.Length) -ne "LiteRustDPAPI1`0") { throw "Unencrypted backup: $backup" }
            }
          }
          if ($saved.search_engine -ne 'yandex') { throw 'Upgrade lost user preference' }
          if ((Get-Content "$profile/upgrade-marker.txt").Trim() -ne 'preserve-profile') { throw 'Upgrade changed profile' }
          if ((Get-FileHash "$folder/literust-browser.exe").Hash -ne (Get-FileHash target/release/literust-browser.exe).Hash) { throw 'Installed executable was not updated' }
          Write-Output 'PASS: upgrade from running 0.16.0-alpha.2, graceful close, preferences and profile preserved'
          $folder = Join-Path $env:LOCALAPPDATA 'Programs\LiteRust'
          $desktop = [Environment]::GetFolderPath('Desktop')
          $programs = [Environment]::GetFolderPath('Programs')
          foreach ($file in @("$folder/literust-browser.exe", "$folder/xray.exe", "$folder/literust.ico", "$folder/Uninstall.exe", "$desktop/LiteRust.lnk", "$programs/LiteRust/LiteRust.lnk")) {
            if (-not (Test-Path $file)) { throw "Missing installed file: $file" }
          }
          $shell = New-Object -ComObject WScript.Shell
          $link = $shell.CreateShortcut("$desktop/LiteRust.lnk")
          if ($link.TargetPath -ne "$folder/literust-browser.exe".Replace('/', '\')) { throw 'Incorrect shortcut target' }
          Remove-Item $log -ErrorAction SilentlyContinue
          $app = Start-Process $link.TargetPath -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 2
              if ((Test-Path $log) -and ((Get-Content $log -Raw) -match 'Main toolbar IPC ready')) { $ready = $true; break }
            }
            if (-not $ready) { throw 'Installed application failed startup' }
          } finally { Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue; $app.WaitForExit() }
          Copy-Item "$folder/Uninstall.exe" "$env:TEMP/LiteRustUninstall.exe"
          $uninstall = Start-Process "$env:TEMP/LiteRustUninstall.exe" -ArgumentList "/S _?=$folder" -Wait -PassThru
          if (Test-Path "$desktop/LiteRust.lnk") { throw 'Desktop shortcut not removed' }
          if (Test-Path "$folder/literust-browser.exe") { Get-ChildItem $folder; throw "Installed browser not removed, uninstall exit: $($uninstall.ExitCode)" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  LiteRust-0.18.0-alpha.1-Setup-x64.exe" | Set-Content packaging/SHA256SUMS.txt
      - name: Preserve installer under test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-under-test
          path: packaging/*Setup-x64.exe
          retention-days: 3
          compression-level: 0
      - name: Preserve Windows diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-diagnostics
          path: |
            target/release/*.log
            packaging/modernization-benchmark.csv
            target/release/literust-browser.exe
            target/release/WebView2Loader.dll
      - name: Publish verified prerelease
        shell: pwsh
        run: |
          gh release create v0.18.0-alpha.1 --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'LiteRust 0.18.0-alpha.1 — Tab resources' --prerelease --notes-file docs/releases/0.18.0-alpha.1.md packaging/LiteRust-0.18.0-alpha.1-Setup-x64.exe packaging/SHA256SUMS.txt "${{ runner.temp }}/literust-source/literust-browser-0.18.0-alpha.1-source.zip"
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
